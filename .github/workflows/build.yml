name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # Use the Geode version from mod.json (4.10.2)
          sdk: given
          combine: true
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-buffer-geode
          path: ./build/*.geode
